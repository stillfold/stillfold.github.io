# Builds and checks the site on every push and pull request.
#
# This does not publish. Cloudflare Pages builds main itself (the same two
# commands, npm run build and npm run check) and serves the result at
# stillfold.dev. This run is the second opinion, and the one that shows on
# a pull request.
name: site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
